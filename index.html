<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Bros</title>
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            --form-height: 4rem;
            --form-content-size: 1rem;
        }
        
        body,
        canvas {
            background-color: black;
        }

        canvas {
            width: 100%;
            object-fit: contain;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        img {
            display: none;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: var(--form-content-size);
        }

        form *{
            font-size: var(--form-content-size);
        }

        input[type="checkbox"] {
            width: var(--form-content-size);
            height: var(--form-content-size);
        }

        main {
            display: flex;
            height: calc(100% - var(--form-height));
        }

        label {
            color: white;
        }
    </style>
    <script type="module" src="./src/index.js"></script>
</head>
<body>
    <form>
        <div>
            <input id="hiei" type="checkbox" name="fighter" value="Hiei"/>
            <label for="hiei">Hiei</label>
        </div>
        <div>
            <input id="yusuke" type="checkbox" name="fighter" value="Yusuke"/>
            <label for="yusuke">Yusuke</label>
        </div>
        <select id="state-dropdown" name="state"></select>
        <button type="submit">Transition!</button>
    </form>
    <main>
        <canvas width="384" height="224"></canvas>
    </main>
    <img src="./images/hiei.png" alt="hiei"/>
    <img src="./images/background.gif" alt="background"/>
    <img src="./images/yusuke.png" alt="yusuke"
</body>
</html>
